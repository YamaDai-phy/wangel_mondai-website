<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ワンゲル図書館</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  </head>
  <body>
    <header>
      <svg width="2rem" height="2rem" xmlns="http://www.w3.org/2000/svg">
        <image href="upload.svg" height="2rem" width="2rem" />
      </svg>
      <h1>受付</h1>
    </header>

    <section class="upload-section">
      <div class="upload-hero">
        <h2>問題を送信する</h2>
      </div>

      <div class="upload-grid">
        <form
          id="upload-form"
          class="upload-card"
          method="post"
          enctype="multipart/form-data"
          target="upload-result-frame"
        >
          <!-- 問題か答えか -->
          <label class="field-group">
            <span class="label-header">
              種別
              <span class="badge badge-required">必須</span>
            </span>
            <select id="type-select" name="doc_type" required>
              <option value="" selected>選択してください</option>
              <option value="question">問題</option>
              <option value="answer">答え</option>
            </select>
          </label>
          <!-- 担当科目 -->
          <label class="field-group">
            <span class="label-header">
              担当科目
              <span class="badge badge-required">必須</span>
            </span>
            <select id="subject-select" name="subject" required>
              <option value="" selected>選択してください</option>
              <option value="共通">共通</option>
              <option value="中国大会予選">中国大会予選（共通）</option>
              <option value="自然観察">自然観察</option>
              <option value="気象">気象</option>
              <option value="救急">救急</option>
            </select>
          </label>

          <!-- アップロード PDF -->
          <label class="field-group">
            <span class="label-header">
              アップロードする PDF
              <span class="badge badge-required">必須</span>
            </span>
            <input
              id="pdf-file"
              name="file"
              type="file"
              accept="application/pdf,.pdf"
              required
            />
          </label>

          <!-- 山の名前（日本語） -->
          <label id="mountain-label" class="field-group" style="display: none">
            <span class="label-header">
              山の名前（日本語）
              <span class="badge badge-required">必須</span>
            </span>
            <input id="mountain-input" type="text" placeholder="例: 富士山" />
          </label>

          <!-- 山の名前（英語） -->
          <label
            id="mountain-en-label"
            class="field-group"
            style="display: none"
          >
            <span class="label-header">
              山の名前（英語 / ローマ字）
              <span class="badge badge-required">必須</span>
            </span>
            <input id="mountain-en-input" type="text" placeholder="例: fuji" />
          </label>

          <!-- アップロード者名 -->
          <label class="field-group">
            <span class="label-header">
              アップロード者名
              <span class="badge badge-required">必須</span>
            </span>
            <span class="field-help">名前 (80回生→80)</span>
            <input
              id="uploader-input"
              name="uploader"
              type="text"
              placeholder="例: 山本(80)"
              required
            />
          </label>

          <hr class="form-divider" />

          <!-- filename -->
          <label class="field-group" id="filename-group">
            <span class="label-header">
              ファイル名 (filename)
              <span class="badge badge-dynamic" id="filename-badge"
                >自動生成</span
              >
            </span>
            <span class="field-help" id="filename-help">
              ※共通・自然観察・中国大会のみ手動変更可能
            </span>
            <div class="input-with-icon">
              <input
                id="filename-input"
                name="filename"
                type="text"
                placeholder="山名や任意のファイル名"
                required
              />
              <span class="input-icon" id="filename-icon">🔒</span>
            </div>
          </label>

          <!-- title -->
          <label class="field-group" id="title-group">
            <span class="label-header">
              タイトル (title)
              <span class="badge badge-dynamic" id="title-badge">自動生成</span>
            </span>
            <span class="field-help" id="title-help">
              ※共通・自然観察・中国大会のみ手動変更可能
            </span>
            <div class="input-with-icon">
              <input
                id="title-input"
                name="title"
                type="text"
                placeholder="科目に応じて自動補完します"
                required
              />
              <span class="input-icon" id="title-icon">🔒</span>
            </div>
          </label>

          <div
            id="upload-status"
            class="upload-status"
            aria-live="polite"
          ></div>
          <div class="upload-actions">
            <button type="submit" id="upload-button">送信する</button>
          </div>

          <input type="hidden" id="path-hidden" name="path" />
        </form>

        <aside class="upload-card upload-preview-card">
          <h3>保存プレビュー</h3>
          <dl class="upload-preview-list">
            <div>
              <dt>保存先</dt>
              <dd id="target-path">未設定</dd>
            </div>
            <div>
              <dt>タイトル候補</dt>
              <dd id="title-preview">未設定</dd>
            </div>
            <div>
              <dt>投稿者名</dt>
              <dd id="uploader-preview">未設定</dd>
            </div>
          </dl>
          <div class="upload-note" id="upload-note"></div>
          <h3>この科目の既存タイトル</h3>
          <div id="category-titles" class="upload-tags">未選択</div>
        </aside>
      </div>

      <iframe
        id="upload-result-frame"
        name="upload-result-frame"
        hidden
      ></iframe>
    </section>

    <footer>
      <p>
        <a href="about.html">資料室へ戻る</a>
        <a href="pdf.html">書庫へ戻る</a>
      </p>
      <p>更新日：2026/08/03</p>
      <p>&copy;https://wangel-mondai.pages.dev</p>
    </footer>
    <script src="upload.js"></script>
  </body>
</html>
