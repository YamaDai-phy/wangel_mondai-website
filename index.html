<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ワンゲル図書館 | 使い方</title>
    <link rel="stylesheet" href="style.css" />

  <body>
    <main class="landing">
      <section class="landing__card" aria-label="サイトの使い方">
        <h1 class="landing__title">このサイトの使い方</h1>
        <p class="landing__lead">
          過去問や自作問題を、科目や山名で探したり、問題を掲載したりできるサイトです。
        </p>
        <ol class="landing__steps">
          <li>検索欄で山名・担当科目を入れて問題を絞り込む</li>
          <li>気になる問題を開いてPDFを確認する</li>
          <li>ダウンロード方法を見ながら端末に保存する</li>
        </ol>
        <div class="landing__actions">
          <a class="landing__button" href="./pdf.html">サイトへ入る</a>
          <p class="landing__note">数秒後に自動で移動します。</p>
        </div>
      </section>
    </main>
    <script>
      window.setTimeout(() => {
        window.location.replace("./pdf.html");
      }, 3000);
    </script>
