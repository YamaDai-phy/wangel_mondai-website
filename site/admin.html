<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>ワンゲル図書館 | PDF管理</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  </head>
  <body class="admin-page">
    <header class="admin-header">
      <div>
        <p class="admin-eyebrow">ワンゲル図書館</p>
        <h1>PDF管理</h1>
      </div>
      <a class="admin-back-link" href="pdf.html">書庫を見る</a>
    </header>

    <main class="admin-main">
      <section id="admin-auth" class="admin-auth" aria-labelledby="admin-auth-title">
        <div>
          <p class="admin-section-kicker">管理者認証</p>
          <h2 id="admin-auth-title">管理トークンを入力</h2>
          <p>このブラウザ内だけに一時保存されます。</p>
        </div>
        <form id="admin-auth-form" class="admin-auth-form">
          <label for="admin-token">管理トークン</label>
          <div>
            <input id="admin-token" type="password" autocomplete="current-password" required />
            <button type="submit">管理画面を開く</button>
          </div>
        </form>
      </section>

      <section id="admin-dashboard" hidden>
        <div id="admin-status" class="admin-status" aria-live="polite"></div>
        <div class="admin-toolbar">
          <div class="admin-summary" id="admin-summary"></div>
          <div class="admin-toolbar-actions">
            <button id="admin-refresh" type="button" class="secondary-button">更新</button>
            <button id="admin-logout" type="button" class="secondary-button">トークンを消去</button>
          </div>
        </div>
        <div class="admin-filters" role="tablist" aria-label="表示するPDFの状態">
          <button type="button" class="is-active" data-filter="pending" role="tab">承認待ち <span></span></button>
          <button type="button" data-filter="published" role="tab">公開中 <span></span></button>
          <button type="button" data-filter="hidden" role="tab">非表示 <span></span></button>
          <button type="button" data-filter="all" role="tab">すべて <span></span></button>
        </div>
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead><tr><th>PDF</th><th>種別</th><th>投稿者</th><th>投稿日時</th><th>状態</th><th>操作</th></tr></thead>
            <tbody id="admin-submission-list"></tbody>
          </table>
        </div>
      </section>
    </main>
    <dialog id="admin-pdf-dialog" class="admin-pdf-dialog">
      <div class="admin-dialog-header"><strong id="admin-pdf-title"></strong><button id="admin-pdf-close" type="button" aria-label="閉じる">×</button></div>
      <iframe id="admin-pdf-frame" title="PDFプレビュー"></iframe>
    </dialog>
    <script src="admin.js"></script>
  </body>
</html>
