<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>ワンゲル図書館 | 投稿確認</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  </head>
  <body>
    <header>
      <h1>投稿確認</h1>
      <nav aria-label="Breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="index.html">ホーム</a></li>
          <li class="breadcrumb-item" aria-current="page">投稿確認</li>
        </ol>
      </nav>
    </header>

    <main class="review-page">
      <div id="review-status" class="upload-status is-info" aria-live="polite">
        投稿情報を読み込んでいます…
      </div>

      <section id="review-content" class="review-content" hidden>
        <div class="upload-card">
          <h2 id="review-title"></h2>
          <form id="metadata-form" class="review-edit-form">
            <label class="field-group">
              <span class="label-header">ファイル名 (filename) <span class="badge badge-editable">変更可能</span></span>
              <div class="input-with-icon"><input id="review-filename-input" type="text" required /><span class="input-icon">✏️</span></div>
            </label>
            <label class="field-group">
              <span class="label-header">タイトル (title) <span class="badge badge-editable">変更可能</span></span>
              <div class="input-with-icon"><input id="review-title-input" type="text" required /><span class="input-icon">✏️</span></div>
            </label>
            <label class="field-group"><span class="label-header">大会名 <span class="badge badge-required">必須</span></span><input id="review-tournament-name" type="text" required /></label>
            <label class="field-group"><span class="label-header">大会年度 <span class="badge badge-required">必須</span></span><input id="review-tournament-year" type="number" min="1900" max="2099" required /></label>
            <button type="submit" id="metadata-save-button">変更を保存</button>
          </form>
          <dl class="upload-preview-list">
            <div>
              <dt>科目</dt>
              <dd id="review-subject"></dd>
            </div>
            <div>
              <dt>種別</dt>
              <dd id="review-type"></dd>
            </div>
            <div>
              <dt>投稿者</dt>
              <dd id="review-uploader"></dd>
            </div>
            <div>
              <dt>ファイル名</dt>
              <dd id="review-filename"></dd>
            </div>
            <div>
              <dt>サイズ</dt>
              <dd id="review-size"></dd>
            </div>
            <div>
              <dt>投稿日時</dt>
              <dd id="review-created"></dd>
            </div>
          </dl>
          <div class="review-actions">
            <button type="button" id="approve-button">公開する</button>
            <button type="button" id="reject-button" class="danger-button">
              却下する
            </button>
          </div>
        </div>

        <div id="comments-card" class="upload-card review-comments" hidden>
          <h2>未完成ファイルへのコメント</h2>
          <div id="comment-list" class="comment-list"></div>
          <form id="comment-form">
            <label class="field-group"><span class="label-header">投稿者</span><input id="comment-author" type="text" maxlength="80" required /></label>
            <label class="field-group"><span class="label-header">コメント</span><textarea id="comment-body" maxlength="1000" rows="4" required></textarea></label>
            <button type="submit" id="comment-submit">コメントを追加</button>
          </form>
        </div>

        <div class="upload-card review-preview-card">
          <h2>PDFプレビュー</h2>
          <iframe id="review-pdf" title="投稿されたPDFのプレビュー"></iframe>
        </div>
      </section>
    </main>

    <footer>
      <p><a href="index.html">ホームへ戻る</a></p>
      <p>更新日：2026/09/04</p>
    </footer>
    <script src="review.js"></script>
  </body>
</html>
