<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ワンゲル図書館 | 使い方</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  </head>
  <body>
    <main class="landing">
      <section class="landing__card" aria-label="サイトの使い方">
        <h1 class="landing__title">このサイトの使い方</h1>
        <p class="landing__lead">
          ワンゲルの過去問・自作問題を探して、すぐに読んだり保存したりできる図書館です。
        </p>
        <div class="landing__features">
          <div><strong>探す</strong><span>山名・科目・大会名で検索</span></div>
          <div><strong>読む</strong><span>PDFをブラウザで確認</span></div>
          <div><strong>保存・共有</strong><span>端末へ保存、複数ファイルを共有</span></div>
          <div><strong>掲載する</strong><span>過去問や自作問題をアップロード</span></div>
        </div>
        <div class="landing__actions">
          <a class="landing__button" href="./pdf.html">問題を探す</a>
          <a class="landing__button landing__button--secondary" href="./fileupload.html">問題を掲載する</a>
          <a class="landing__button landing__button--secondary" href="./tozan-quiz/">登山用語クイズ</a>
          <p class="landing__note">上のボタンからすぐに利用できます。</p>
          <p class="landing__note" id="last-updated" aria-live="polite">最終更新日時を読み込み中…</p>
        </div>
      </section>
    </main>
    <script src="last-updated.js"></script>

  </body>
</html>
