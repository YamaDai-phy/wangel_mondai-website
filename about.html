<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ワンゲル図書館</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  </head>
  <body>
    <header><h1>資料室</h1></header>

    <section class="details-section">
      <p class="release-note">現在の公開状況と、更新状況</p>

      <details class="accordion">
        <summary class="accordion__summary">公開中ページ</summary>
        <div class="release-body">
          <p>pdf.html</p>
        </div>
      </details>

      <details class="accordion">
        <summary class="accordion__summary">最近の更新</summary>
        <div class="release-body">
          <table id="recent-table" class="release-table">
            <thead>
              <tr>
                <th>日付</th>
                <th>内容</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td colspan="2">読み込み中…</td>
              </tr>
            </tbody>
          </table>
        </div>
      </details>

      <details class="accordion">
        <summary class="accordion__summary">今後の予定</summary>
        <div class="release-body">
          <table id="upcoming-table" class="release-table">
            <thead>
              <tr>
                <th>予定</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>読み込み中…</td>
              </tr>
            </tbody>
          </table>
        </div>
      </details>

      <details class="accordion">
        <summary class="accordion__summary">制作者</summary>
        <div class="release-body">
          <table id="authors-table" class="release-table">
            <thead>
              <tr>
                <th>名前</th>
                <th>役割</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td colspan="2">読み込み中…</td>
              </tr>
            </tbody>
          </table>
        </div>
      </details>
    </section>

    <footer>
      <p><a href="pdf.html">書庫へ戻る</a></p>
      <p>更新日：2026/08/03</p>
      <p>&copy;https://wangel-mondai.pages.dev</p>
    </footer>
    <script src="load_release.js"></script>
    <!-- Cloudflare Web Analytics -->
    <script
      type="module"
      src="https://static.cloudflareinsights.com/beacon.min.js"
      data-cf-beacon='{"token": "e681d5f56e1f4a8d996e6e1269b8e596"}'
    ></script>
    <!-- End Cloudflare Web Analytics -->
  </body>
</html>
